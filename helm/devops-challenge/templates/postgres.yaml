apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  labels:
    {{- include "devops-challenge.labels" . | nindent 4 }}
    app.kubernetes.io/name: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      {{- include "devops-challenge.selectorLabels" (dict "component" "mongodb" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "devops-challenge.selectorLabels" (dict "component" "mongodb" "root" .) | nindent 8 }}
        app.kubernetes.io/part-of: devops-challenge
        {{- if .Values.awsSecretsManager.enabled }}
        {{- end }}
    spec:
      {{- if .Values.awsSecretsManager.enabled }}
      serviceAccountName: {{ include "devops-challenge.serviceAccountName" . }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          ports:
            - name: mongodb
              containerPort: 27017
              protocol: TCP
          env:
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: challenge-config
                  key: DB_NAME
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: challenge-config
                  key: DB_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "devops-challenge.secretName" . }}
                  key: MONGO_PASSWORD
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: tmp
              mountPath: /tmp
            {{- if .Values.awsSecretsManager.enabled }}
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if not .Values.database.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if .Values.awsSecretsManager.enabled }}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: challenge-key-vault
        {{- end }}
  {{- if .Values.database.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "devops-challenge.labels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.database.persistence.storageClass }}
        storageClassName: {{ .Values.database.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    {{- include "devops-challenge.labels" . | nindent 4 }}
    app.kubernetes.io/name: mongodb
spec:
  clusterIP: None
  selector:
    {{- include "devops-challenge.selectorLabels" (dict "component" "mongodb" "root" .) | nindent 4 }}
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
      protocol: TCP

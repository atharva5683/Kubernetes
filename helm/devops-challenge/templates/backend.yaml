apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    {{- include "devops-challenge.labels" . | nindent 4 }}
    app.kubernetes.io/name: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "devops-challenge.selectorLabels" (dict "component" "backend" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "devops-challenge.selectorLabels" (dict "component" "backend" "root" .) | nindent 8 }}
        app.kubernetes.io/part-of: devops-challenge
        {{- if .Values.awsSecretsManager.enabled }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      {{- if .Values.awsSecretsManager.enabled }}
      serviceAccountName: {{ include "devops-challenge.serviceAccountName" . }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: APP_VERSION
              value: {{ .Values.backend.image.tag | quote }}
          envFrom:
            - configMapRef:
                name: challenge-config
            - secretRef:
                name: {{ include "devops-challenge.secretName" . }}
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.awsSecretsManager.enabled }}
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.awsSecretsManager.enabled }}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: challenge-key-vault
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    {{- include "devops-challenge.labels" . | nindent 4 }}
    app.kubernetes.io/name: backend
spec:
  type: ClusterIP
  selector:
    {{- include "devops-challenge.selectorLabels" (dict "component" "backend" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
